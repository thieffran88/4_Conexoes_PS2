name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes de regras e IA (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: make -f Makefile.host test host

  ps2:
    name: ELF para PlayStation 2
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependências
        run: apk add --no-cache build-base git
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: 4conexoes-ps2
          path: 4conexoes.elf
