name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão a publicar como release (ex.: v1.0.0). Vazio = só compilar."
        required: false
        default: ""

jobs:
  testes:
    name: Testes de regras, IA e áudio (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes
        run: make -f Makefile.host test host

  ps2:
    name: ELF para PlayStation 2
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - name: Dependências
        run: apk add --no-cache build-base git
      - uses: actions/checkout@v4
      - name: Compilar
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: 4conexoes-ps2
          path: 4conexoes.elf

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.versao != ''
    env:
      VERSAO: ${{ inputs.versao || github.ref_name }}
    needs: [testes, ps2]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 4conexoes-ps2
          path: dist
      - name: Empacotar
        run: |
          cp README.md dist/LEIA-ME.md
          cd dist && zip -9 ../4conexoes-ps2-$VERSAO.zip 4conexoes.elf LEIA-ME.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSAO }}
          target_commitish: ${{ github.sha }}
          name: 4 Conexões ${{ env.VERSAO }}
          body_path: .github/release-notes.md
          files: |
            dist/4conexoes.elf
            4conexoes-ps2-${{ env.VERSAO }}.zip
